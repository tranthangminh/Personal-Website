<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8DF2F2" />
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bgGrad2)" />
  <rect x="25" y="25" width="250" height="250" rx="8" fill="none" stroke="#222b3a" stroke-width="2" />
  <rect x="35" y="35" width="230" height="230" rx="6" fill="none" stroke="url(#accentGrad2)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Book Icon & Embodiment Motif -->
  <g transform="translate(150, 115)">
    <!-- Book silhouette -->
    <path d="M-45,20 C-20,10 0,20 0,20 C0,20 20,10 45,20 L45,-30 C20,-40 0,-30 0,-30 C0,-30 -20,-40 -45,-30 Z" fill="none" stroke="url(#accentGrad2)" stroke-width="2.5" />
    <line x1="0" y1="-30" x2="0" y2="20" stroke="url(#accentGrad2)" stroke-width="2" />
    <!-- Movement & Expression Spark -->
    <path d="M0,-20 L4,-8 L16,-4 L4,0 L0,12 L-4,0 L-16,-4 L-4,-8 Z" fill="url(#accentGrad2)" />
    <circle cx="-24" cy="-6" r="3" fill="#8DF2F2" />
    <circle cx="24" cy="-6" r="3" fill="#38bdf8" />
  </g>

  <!-- Title Text -->
  <text x="150" y="185" text-anchor="middle" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" letter-spacing="2">AN ACTOR'S WORK</text>
  <text x="150" y="208" text-anchor="middle" fill="#8DF2F2" font-family="'Montserrat', sans-serif" font-weight="800" font-size="16" letter-spacing="3">PART 2</text>
  <text x="150" y="232" text-anchor="middle" fill="#94a3b8" font-family="'Montserrat', sans-serif" font-weight="400" font-size="10.5" letter-spacing="1">K. STANISLAVSKI</text>
</svg>
